services:
  mongo:
    image: mongo:latest
    container_name: mongo

  nats:
    container_name: nats
    image: nats:2.14.0-alpine3.22
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  user-service:
    container_name: user-service
    build: ./user-service
    ports:
      - "50050:50050"
    env_file:
      - ./user-service/.env
    depends_on:
      - mongo
  notification-service:
    container_name: notification-service
    build: ./notification-service
    ports:
      - "50049:50049"
    env_file:
      - ./notification-service/.env
    depends_on:
      - nats

  auth-service:
    container_name: auth-service
    build: ./auth-service
    ports:
      - "${AUTH_GRPC_PORT:-50051}:${AUTH_GRPC_PORT:-50051}"
    depends_on:
      - nats
    env_file:
      - ./auth-service/.env
  chat-service:
    container_name: chat-service
    build: ./chat-service
    ports:
      - "${CHAT_GRPC_PORT:-50053}:${CHAT_GRPC_PORT:-50053}"
    depends_on:
      - nats
      - mongo
      - user-service
    env_file:
      - ./chat-service/.env
    environment:
      - USER_GRPC_URL=user-service:50050
      - CHAT_MONGO_URI=mongodb://mongo:27017

  content-service:
    container_name: content-service
    build:
      context: ./content-service
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    environment:
      - GRPC_PORT=50052
      - MONGO_URI=mongodb://mongo:27017
      - DB_NAME=maxat_content_db
      - REDIS_ADDR=redis:6379
      - USER_SERVICE_URL=user-service:50050
      - NATS_URL=nats://nats:4222
    depends_on:
      - mongo
      - nats
      - user-service

  api-gateway:
    container_name: api-gateway
    build: ./api-gateway
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    environment:
      - HTTP_PORT=${HTTP_PORT:-8080}
      - AUTH_SERVICE_ADDR=auth-service:50051
      - USER_SERVICE_ADDR=user-service:50050
      - CONTENT_SERVICE_ADDR=content-service:50052
      - CHAT_SERVICE_ADDR=chat-service:50053
      - SECRET_KEY=${SECRET_KEY:-secret-key}
    depends_on:
      - auth-service
      - user-service
      - content-service
      - chat-service

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "80:80"
    env_file:
      - ./frontend/.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://api-gateway:8080}
    depends_on:
      - api-gateway