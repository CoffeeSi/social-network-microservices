services:
  mongo-replica:
    image: mongo:latest
    container_name: mongo-replica
    command: ["--replSet", "rs0", "--bind_ip_all"]
  mongo-no-replica:
    image: mongo:latest
    container_name: mongo-no-replica

  mongo-init:
    image: mongo:latest
    container_name: mongo-init
    depends_on:
      - mongo-replica
    restart: "no"
    entrypoint: >
      bash -c "
        sleep 5 &&
        mongosh --host mongo-replica:27017 --eval '
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongo-replica:27017\" }]
          })
        '
      "

  nats:
    container_name: nats
    image: nats:2.14.0-alpine3.22
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"

  user-service:
    container_name: user-service
    build: ./user-service
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
      - "${USER_SERVICE_PORT_HTTP}:${USER_SERVICE_PORT_HTTP}"
    env_file:
      - ./user-service/.env
    depends_on:
      - mongo-no-replica
  notification-service:
    container_name: notification-service
    build: ./notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    env_file:
      - ./notification-service/.env
    depends_on:
      - nats

  auth-service:
    container_name: auth-service
    build: ./auth-service
    ports:
      - "${AUTH_GRPC_PORT:-50051}:${AUTH_GRPC_PORT:-50051}"
    depends_on:
      - nats
    env_file:
      - ./auth-service/.env
  api-gateway:
      container_name: api-gateway
      build: ./api-gateway
      ports:
        - "${API_GATEWAY_PORT:-8080}:${API_GATEWAY_PORT:-8080}"
      env_file:
        - ./api-gateway/.env
      depends_on:
        - auth-service
        - user-service
        - content-service
        - chat-service

  chat-service:
    container_name: chat-service
    build: ./chat-service
    ports:
      - "${CHAT_GRPC_PORT:-50053}:${CHAT_GRPC_PORT:-50053}"
    depends_on:
      - nats
      - mongo-no-replica
      - user-service
    env_file:
      - ./chat-service/.env

  content-service:
    container_name: content-service
    build:
      context: ./content-service
      dockerfile: Dockerfile
    ports:
      - "${CONTENT_SERVICE_PORT}:${CONTENT_SERVICE_PORT}"
      - "${CONTENT_SERVICE_PORT_HTTP}:${CONTENT_SERVICE_PORT_HTTP}"
    env_file:
      - ./content-service/.env
    depends_on:
      - mongo-replica
      - nats
      - user-service

  api-gateway:
    container_name: api-gateway
    build: ./api-gateway
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    environment:
      - HTTP_PORT=${HTTP_PORT:-8080}
      - AUTH_SERVICE_ADDR=auth-service:50051
      - USER_SERVICE_ADDR=user-service:50050
      - CONTENT_SERVICE_ADDR=content-service:50052
      - CHAT_SERVICE_ADDR=chat-service:50053
      - SECRET_KEY=${SECRET_KEY:-secret-key}
    depends_on:
      - auth-service
      - user-service
      - content-service
      - chat-service

  frontend:
    container_name: frontend
    build: ./frontend
    ports:
      - "80:80"
    env_file:
      - ./frontend/.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://api-gateway:8080}
    depends_on:
      - api-gateway
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - prometheus

volumes:
  grafana_data:
