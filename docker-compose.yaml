services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
  nats:
    container_name: nats
    image: nats:2.14.0-alpine3.22
  auth-service:
    container_name: auth-service
    build: ./auth-service
    ports:
      - "50051:50051"
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222
      - GRPC_PORT=50051
      - USER_GRPC_URL=user-service:50052
      - SECRET_KEY=secret-key
  user-service:
    container_name: user-service
    build: ./user-service
    ports:
      - "50050:50050"
    env_file:
      - ./user-service/.env
