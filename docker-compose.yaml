services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
  nats:
    container_name: nats
    image: nats:2.14.0-alpine3.22

  user-service:
    container_name: user-service
    build: ./user-service
    ports:
      - "50050:50050"
    env_file:
      - ./user-service/.env

  auth-service:
    container_name: auth-service
    build: ./auth-service
    ports:
      - "${AUTH_GRPC_PORT:-50051}:${AUTH_GRPC_PORT:-50051}"
    depends_on:
      - nats
    env_file:
      - ./auth-service/.env

  chat-service:
    container_name: chat-service
    build: ./chat-service
    ports:
      - "${CHAT_GRPC_PORT:-50053}:${CHAT_GRPC_PORT:-50053}"
    depends_on:
      - nats
    env_file:
      - ./chat-service/.env

  content-service:
    container_name: content-service
    build: ./content-service
    ports:
      - "50052:50052"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - USER_SERVICE_ADDR=user-service:50050
    depends_on:
      - mongo
      - user-service
