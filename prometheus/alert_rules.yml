groups:
  - name: sre-slo-alerts
    rules:


      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."


      - alert: HighErrorRate
        expr: |
          sum(rate(grpc_server_handled_total{grpc_code!="OK"}[5m])) by (job, grpc_service)
          / sum(rate(grpc_server_handled_total[5m])) by (job, grpc_service) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High gRPC error rate on {{ $labels.job }}/{{ $labels.grpc_service }}"
          description: "Error rate is {{ printf \"%.2f\" (mul $value 100) }}% (SLO: < 1%)."


      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(grpc_server_handling_seconds_bucket[5m])) by (le, job, grpc_service, grpc_method)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}/{{ $labels.grpc_method }}"
          description: "p95 latency is {{ printf \"%.0f\" (mul $value 1000) }}ms (SLO: ≤ 200ms)."


      - alert: AvailabilityBelowSLO
        expr: |
          sum(rate(grpc_server_handled_total{grpc_code="OK"}[5m])) by (job, grpc_service)
          / sum(rate(grpc_server_handled_total[5m])) by (job, grpc_service) < 0.99
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Availability SLO breach on {{ $labels.job }}/{{ $labels.grpc_service }}"
          description: "Availability is {{ printf \"%.2f\" (mul $value 100) }}% (SLO: ≥ 99%)."



      - alert: UserServiceAuthFailures
        expr: |
          sum(rate(grpc_server_handled_total{grpc_service="user.UserService", grpc_code!="OK"}[5m]))
          / sum(rate(grpc_server_handled_total{grpc_service="user.UserService"}[5m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "UserService gRPC failures detected"
          description: "More than 5% of UserService calls are failing."


      - alert: ErrorBudgetBurnRateHigh
        expr: |
          (
            1 - sum(rate(grpc_server_handled_total{grpc_code="OK"}[1h])) by (job, grpc_service)
                / sum(rate(grpc_server_handled_total[1h])) by (job, grpc_service)
          ) > 14.4 * 0.001
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Error budget burning fast on {{ $labels.job }}/{{ $labels.grpc_service }}"
          description: "At current rate the monthly error budget will be exhausted in < 2 days."